name: Content admin checks
on:
  pull_request:
    paths:
      - 'content-admin/**'
      - '.github/workflows/content-admin-check.yml'
  push:
    branches:
      - 'feature/bmc-sierra-content-admin'
    paths:
      - 'content-admin/**'
      - '.github/workflows/content-admin-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: content-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: python3 test/verify-seeds.py
